# Starship 提示符配置（Ubuntu 24）
# 原教旨原则：不设第三方主题/调色板，使用 starship 内置默认配色。
# 保留最小定制：显示 OS 图标 + 用户名（与原布局接近，但全部用默认颜色）。

# === 默认 format（starship 内置，含目录/git/语言/时间等模块）===
# 不覆盖 format，使用默认布局与默认配色。

# === OS 图标 ===
[os]
disabled = false

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

# === 用户名（显示当前用户）===
[username]
show_always = true

# === 命令耗时通知（默认关闭，打开以在长命令结束时通知）===
[cmd_duration]
show_notifications = true
min_time_to_notify = 3000
