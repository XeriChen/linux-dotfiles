# ============================================================================
# tmux i3 风格配置
# 来源: archibate/dotfiles（改编）
# 原则: 不替换默认前缀键(Ctrl+b)，在 Alt 前缀上增加 i3 风格直接绑定
# 冲突修正: 去掉 Alt+Tab(系统窗口切换)、Alt+Left/Right(系统 back/forward)
# ============================================================================

# ----------------------------------------------------------------------------
# 核心设置
# ----------------------------------------------------------------------------

# 零延迟 - vim 用户必需
set -s escape-time 0

# 窗口和 pane 从 1 开始编号
set -g base-index 1
setw -g pane-base-index 1

# 关闭窗口时自动重编号
set -g renumber-windows on

# 鼠标支持
set -g mouse on

# vi 模式复制
setw -g mode-keys vi

# 启用 xterm 扩展键
setw -g xterm-keys on
set -s extended-keys always

# 终端颜色支持
if-shell 'test -n "$KITTY_WINDOW_ID"' \
    'set -g default-terminal "xterm-kitty"' \
    'set -g default-terminal "xterm-256color"'

set -ag terminal-features "xterm*:sixel"
set -ag terminal-features "xterm*:RGB"
set -ag terminal-overrides "*:XT"
set -ag terminal-overrides "xterm*:Tc"
set -ag terminal-overrides 'xterm*:Tc:smglen@'
set -as terminal-features ",*:hyperlinks"
set -as terminal-features 'xterm*:extkeys'

# 历史记录上限
set -g history-limit 50000

# 状态栏刷新间隔
set -g status-interval 15

# vim autoread 需要 focus events
set -g focus-events on

# 共享 session 时激进调整大小
setw -g aggressive-resize on

# ----------------------------------------------------------------------------
# 剪贴板 - OSC 52
# ----------------------------------------------------------------------------

set -g set-clipboard on
set -g allow-passthrough on
set -g visual-activity on

# vi 模式复制使用 OSC 52
bind -T copy-mode-vi y send -X copy-pipe-and-cancel ""
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel ""
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel ""

# Vim 风格可视选择
unbind-key -T copy-mode-vi v
bind -T copy-mode-vi d send -X clear-selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 粘贴
unbind -T copy-mode-vi p
bind -T copy-mode-vi p paste-buffer \; send -X cancel
bind -n M-p paste-buffer

# ----------------------------------------------------------------------------
# 插件管理 (TPM)
# ----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'

# i3 风格键位
set -g @plugin 'jabirali/tmux-tilish'

# fuzzy session 管理
set -g @plugin 'omerxx/tmux-sessionx'

# session 持久化
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 鼠标滚动优化
set -g @plugin 'NHDaly/tmux-better-mouse-mode'

# ----------------------------------------------------------------------------
# 插件配置: better-mouse-mode
# ----------------------------------------------------------------------------
set -g @scroll-in-moused-over-pane "on"
set -g @scroll-down-exit-copy-mode "on"
set -g @scroll-without-changing-pane "off"
set -g @scroll-speed-num-lines-per-scroll "1"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# ----------------------------------------------------------------------------
# 插件配置: tmux-tilish (i3 风格键位)
# ----------------------------------------------------------------------------
set -g @tilish-default "main-vertical"
set -g @tilish-enforce ""
set -g @tilish-dmenu 'off'
set -g @tilish-noprefix "on"

# ----------------------------------------------------------------------------
# 插件配置: tmux-sessionx
# ----------------------------------------------------------------------------
set -g @sessionx-window-mode "on"
set -g @sessionx-zoxide-mode "on"
set -g @sessionx-preview-enabled "true"
set -g @sessionx-auto-accept "off"
set -g @sessionx-prefix "off"
set -g @sessionx-bind "M-Space"

# ----------------------------------------------------------------------------
# 插件配置: tmux-resurrect (session 持久化)
# ----------------------------------------------------------------------------
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-processes 'vi vim nvim emacs man less head tail nvimpager top htop nvtop btm git lazygit yazi zellij'

# ----------------------------------------------------------------------------
# 插件配置: tmux-continuum (自动保存)
# ----------------------------------------------------------------------------
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# ----------------------------------------------------------------------------
# 状态栏
# ----------------------------------------------------------------------------
set -g status-position bottom

# ----------------------------------------------------------------------------
# 自定义键位（补充 tmux-tilish）
# ----------------------------------------------------------------------------

# Alt+0: 切换到窗口 10
bind -n M-0 select-window -t 0

# Alt+Shift+0: 移动 pane 到窗口 10
bind -n M-S-0 join-pane -t :10

# Alt+u: 切换到上次窗口（替代上游的 Alt+Tab，避免与系统窗口切换冲突）
bind -n M-u select-window -l

# Alt+=: 当前目录弹出终端
bind -n M-= display-popup -E -d "#{pane_current_path}"

# Alt+\: 水平分屏
bind -n M-\\ split-window -h -c "#{pane_current_path}"

# Alt+-: 垂直分屏
bind -n M-- split-window -v -c "#{pane_current_path}"

# Alt+s: main-horizontal 布局
bind -n M-s select-layout main-horizontal

# Alt+Shift+v: even-vertical 布局
bind -n M-S-v select-layout even-vertical

# Alt+Shift+s: even-horizontal 布局
bind -n M-S-s select-layout even-horizontal

# Alt+Shift+t: tiled 布局
bind -n M-S-t select-layout tiled

# Alt+z: zoom toggle
bind -n M-z resize-pane -Z

# Alt+d: kill pane
bind -n M-d kill-pane

# Alt+f: session 切换弹窗
bind -n M-f display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/session-switcher.sh"

# Alt+g: zoxide 目录跳转弹窗
bind -n M-g display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/zoxide-jump.sh"

# Alt+e: 捕获并编辑
bind -n M-e run-shell "~/.config/tmux/scripts/capture-edit.sh"

# Alt+i: 切换到上次 session
bind -n M-i switch-client -l

# ----------------------------------------------------------------------------
# Pane 导航（tmux-tilish 已处理 Alt+hjkl，这里补充交换）
# ----------------------------------------------------------------------------
bind -n M-S-h swap-pane -U
bind -n M-S-j swap-pane -D
bind -n M-S-k swap-pane -U
bind -n M-S-l swap-pane -D

# ----------------------------------------------------------------------------
# Copy Mode
# ----------------------------------------------------------------------------
bind -n M-up copy-mode \; send-keys -X scroll-up
bind -n M-down copy-mode
bind -n M-pageup copy-mode -u
bind -n M-pagedown copy-mode

bind-key -T copy-mode-vi M-up send-keys -X scroll-up
bind-key -T copy-mode-vi M-down send-keys -X scroll-down
bind-key -T copy-mode-vi M-pageup send-keys -X page-up
bind-key -T copy-mode-vi M-pagedown send-keys -X page-down

set-hook -g after-copy-mode 'set -p cursor-style underline'

bind Enter copy-mode
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape send -X cancel

# ----------------------------------------------------------------------------
# TPM 初始化（必须在文件末尾）
# ----------------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
